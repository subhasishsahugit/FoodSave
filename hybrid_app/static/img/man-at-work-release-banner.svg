<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Man at Work - Project Complete, Fine-Tuning in Progress</title>
  <desc id="desc">A high-impact status banner saying MAN AT WORK. This project is completed, we are fine-tuning it, release coming soon, thank you.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="45%" stop-color="#141d29"/>
      <stop offset="100%" stop-color="#0a1219"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8e7ef"/>
      <stop offset="50%" stop-color="#8da4b3"/>
      <stop offset="100%" stop-color="#5b7280"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <circle cx="1320" cy="160" r="220" fill="#22d3ee" fill-opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="300" cy="760" r="260" fill="#34d399" fill-opacity="0.10" filter="url(#softGlow)"/>

  <g transform="translate(95 90)">
    <rect x="0" y="0" width="1410" height="720" rx="28" fill="#0f1722" fill-opacity="0.70" stroke="#7dd3fc" stroke-opacity="0.28"/>

    <g transform="translate(76 78)">
      <rect x="0" y="0" width="280" height="56" rx="14" fill="url(#accent)"/>
      <text x="140" y="37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#041317">FOODSAVE STATUS</text>

      <text x="0" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="106" font-weight="900" letter-spacing="2" fill="#ecfeff">MAN AT WORK</text>

      <rect x="0" y="178" width="760" height="5" rx="2.5" fill="url(#accent)"/>

      <text x="0" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#d6f4ff">
        This project is completed.
      </text>
      <text x="0" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#d6f4ff">
        We are fine-tuning it.
      </text>
      <text x="0" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#d6f4ff">
        We will release soon.
      </text>

      <g transform="translate(0 430)">
        <rect x="0" y="0" width="640" height="94" rx="16" fill="#0a131c" stroke="#34d399" stroke-opacity="0.45"/>
        <text x="34" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#7af0ca">Thank you.</text>
      </g>
    </g>

    <g transform="translate(980 170)">
      <rect x="90" y="390" width="220" height="24" rx="12" fill="#5eead4" fill-opacity="0.35"/>

      <g transform="translate(140 72)">
        <ellipse cx="60" cy="64" rx="58" ry="58" fill="url(#metal)"/>
        <circle cx="40" cy="52" r="8" fill="#17212b"/>
        <circle cx="79" cy="52" r="8" fill="#17212b"/>
        <path d="M30 84 Q60 106 90 84" fill="none" stroke="#17212b" stroke-width="6" stroke-linecap="round"/>
      </g>

      <g transform="translate(118 198)">
        <rect x="0" y="0" width="164" height="170" rx="26" fill="#6b8291"/>
        <rect x="22" y="20" width="120" height="42" rx="10" fill="#0e1821"/>
      </g>

      <g transform="translate(32 238)">
        <rect x="0" y="0" width="170" height="34" rx="17" transform="rotate(-24 85 17)" fill="#8fb5c7"/>
        <circle cx="150" cy="-20" r="22" fill="#b5cad6"/>
      </g>

      <g transform="translate(214 248)">
        <rect x="0" y="0" width="170" height="34" rx="17" transform="rotate(22 85 17)" fill="#8fb5c7"/>
        <rect x="136" y="-54" width="38" height="76" rx="8" fill="#22d3ee"/>
        <rect x="141" y="-47" width="28" height="62" rx="6" fill="#0d1620"/>
      </g>

      <g transform="translate(132 514)">
        <rect x="0" y="0" width="46" height="140" rx="22" fill="#7e97a5"/>
        <rect x="96" y="0" width="46" height="140" rx="22" fill="#7e97a5"/>
      </g>

      <g transform="translate(112 630)">
        <rect x="0" y="0" width="82" height="26" rx="10" fill="#9ec4d8"/>
        <rect x="98" y="0" width="82" height="26" rx="10" fill="#9ec4d8"/>
      </g>
    </g>
  </g>
</svg>
