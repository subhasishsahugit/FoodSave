name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: hybrid_app/requirements.txt

      - name: Install dependencies
        run: pip install -r hybrid_app/requirements.txt

      - name: Seed database
        run: python hybrid_app/seed_db.py

      - name: Smoke-test Flask app starts
        run: |
          FLASK_DEBUG=0 python hybrid_app/app.py &
          APP_PID=$!
          sleep 5
          curl --fail --silent --show-error http://127.0.0.1:5000/ | grep -q "FoodSave" && echo "App responded OK"
          kill $APP_PID
